<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segítő Hősök</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6dc;--card:#ffffff;--ink:#27343a;--mut:#6b7a80;--acc:#f2a900;--acc2:#e8573c;--ok:#2e9e6b;--line:#e8dcb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12313a;--card:#1b4651;--ink:#f4efe0;--mut:#9fc0c4;--acc:#ffcf4a;--acc2:#ff7b5c;--ok:#7fe0b0;--line:#2c6370}}
:root[data-theme="dark"]{--bg:#12313a;--card:#1b4651;--ink:#f4efe0;--mut:#9fc0c4;--acc:#ffcf4a;--acc2:#ff7b5c;--ok:#7fe0b0;--line:#2c6370}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Baloo 2",system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:12px 14px 90px}
h1,h2,h3{margin:0;font-weight:800}h2{font-size:22px}h3{font-size:17px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{flex:1}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 14px;background:var(--acc);color:#2b2200;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.on{outline:3px solid var(--acc2)}button:disabled{opacity:.45}
select,input{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .6s}
.top{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.top button{padding:4px 10px;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line);max-width:560px;margin:0 auto}
nav button{flex:1;background:transparent;color:var(--mut);padding:6px 2px;font-size:12px;line-height:1.1}
nav button.on{color:var(--ink);background:var(--line);outline:0}nav b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--line);font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--acc);color:#2b2200;padding:12px 18px;border-radius:16px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;animation:pop .5s cubic-bezier(.3,1.6,.5,1);text-align:center;max-width:90%}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}}
.tool{text-align:center;padding:10px 4px;border-radius:16px;border:3px solid}
.tool .e{font-size:34px}details.card summary{cursor:pointer}details.card div{font-size:15px}.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid var(--line)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar i{transition:none}}
</style></head><body><div id="app"></div><div id="toastbox"></div>
<script>
const SK={kert:{n:"Kertészet",i:"🌱",t:["Fakapa","Vaskapa","Ezüstkapa","Aranykapa","Gyémántkapa"],e:"⛏️"},
rend:{n:"Rendrakás",i:"🧸",t:["Szalmaseprű","Vasseprű","Ezüstseprű","Aranyseprű","Gyémántseprű"],e:"🧹"},
konyha:{n:"Konyha",i:"🍳",t:["Fakanál","Vaskanál","Ezüstkanál","Aranykanál","Gyémántkanál"],e:"🥄"},
vasar:{n:"Bevásárlás",i:"🛒",t:["Szatyor","Vászonkosár","Ezüstkosár","Aranykosár","Gyémántkosár"],e:"🧺"},
allat:{n:"Állatgondozás",i:"🐾",t:["Zsineg póráz","Bőrpóráz","Ezüstpóráz","Aranypóráz","Gyémántpóráz"],e:"🦴"},
mosas:{n:"Ruhák és mosás",i:"🫧",t:["Mosóteknő","Vascsipesz","Ezüstcsipesz","Aranycsipesz","Gyémántcsipesz"],e:"🧼"},
tanul:{n:"Tanulás",i:"📚",t:["Faceruza","Vastoll","Ezüsttoll","Aranytoll","Gyémánttoll"],e:"✏️"},
onell:{n:"Önellátás",i:"🪥",t:["Fakefe","Vaskefe","Ezüstkefe","Aranykefe","Gyémántkefe"],e:"🪥"},
hobbi:{n:"Hobbi (kreativitás)",i:"🧩",t:["Puzzle","Kreatív készlet","Ezüst puzzle","Arany puzzle","Gyémánt puzzle"],e:"🧩"}};
const TC=["#a67c52","#9aa5ad","#c9d1d8","#ffcf4a","#6fe3ff"];
const Q=[{id:2,n:"Locsolás, gyomlálás",i:"🚿",s:"kert",x:8},
{id:3,n:"Szoba rendrakás",i:"🛏️",s:"rend",x:10},{id:4,n:"Játékok elpakolása",i:"🧸",s:"rend",x:6},
{id:5,n:"Porszívózás, söprés",i:"🧹",s:"rend",x:10},{id:6,n:"Segítség főzésnél",i:"🥕",s:"konyha",x:10},
{id:7,n:"Mosogatás, asztalterítés",i:"🍽️",s:"konyha",x:8},{id:8,n:"Bevásárlás, cipelés",i:"🛒",s:"vasar",x:10},
{id:9,n:"Kutya, macska ellátása",i:"🐕",s:"allat",x:8,d:1},{id:10,n:"Ruhák teregetése, összehajtása",i:"👕",s:"mosas",x:8},
{id:11,n:"Házi feladat",i:"📚",s:"tanul",x:12,h:1},{id:12,n:"Olvasás",i:"📖",s:"tanul",x:10},{id:13,n:"Gyakorlás (szorzótábla, hangszer)",i:"🧮",s:"tanul",x:10},{id:14,n:"Fogmosás, fürdés",i:"🪥",s:"onell",x:1,d:1},
{id:15,n:"Szófogadás, viselkedés",i:"😇",s:"onell",x:1},{id:16,n:"Hobbi (kreativitás)",i:"🧩",s:"hobbi",x:1}];
const allQ=()=>Q.concat(S.cq||[]);
const PETS=[{id:"ham",n:"Hörcsög",e:"🐹",p:40},{id:"bun",n:"Nyuszi",e:"🐰",p:70},{id:"cat",n:"Cica",e:"🐱",p:90},{id:"dog",n:"Kutyus",e:"🐶",p:100},{id:"tur",n:"Teknős",e:"🐢",p:130},{id:"dra",n:"Sárkány",e:"🐲",p:400},
{id:"chk",n:"Csibe",e:"🐥",p:30},{id:"frog",n:"Béka",e:"🐸",p:50},{id:"hog",n:"Sün",e:"🦔",p:60},{id:"fox",n:"Róka",e:"🦊",p:110},{id:"pan",n:"Panda",e:"🐼",p:150},{id:"owl",n:"Bagoly",e:"🦉",p:160},{id:"uni",n:"Unikornis",e:"🦄",p:400},{id:"fen",n:"Főnix",e:"🔥",p:400}];
const X2=["dra","uni","fen"],isX2=id=>X2.includes(id),petTag=id=>isX2(id)?" · 2x érme":id=="owl"?" · +20% XP tanuláshoz":"";
const DRW=[{id:"r1",n:"Extra 30 perc Telefonozás",e:"📱",p:1000},{id:"r2",n:"Extra 30 perc mesenézés",e:"📺",p:1000},{id:"r3",n:"Családi társasjáték est",e:"♟️",p:5000},{id:"r4",n:"Közös fagyizás",e:"🍦",p:10000},{id:"r5",n:"MEKI",e:"🍔",p:20000},{id:"r6",n:"Mozizás",e:"🎬",p:20000},{id:"r7",n:"Pizzázás",e:"🍕",p:20000}];
const rw=()=>(S.rw||DRW).slice().sort((a,b)=>a.p-b.p),plv=x=>1+Math.floor(Math.sqrt((x||0)/20));
const SHOP=[{id:"cap",n:"Sapka",e:"🧢",p:20},{id:"flower",n:"Virág",e:"🌸",p:25},{id:"bow",n:"Masni",e:"🎀",p:25},{id:"scarf",n:"Sál",e:"🧣",p:30},
{id:"glass",n:"Napszemüveg",e:"🕶️",p:40},{id:"mask",n:"Hősmaszk",e:"🎭",p:45},{id:"cape",n:"Köpeny",e:"🦸",p:80},{id:"wiz",n:"Varázskalap",e:"🧙",p:90},
{id:"wings",n:"Szárnyak",e:"🦋",p:100},{id:"crown",n:"Korona",e:"👑",p:150},{id:"pirate",n:"Kalózkalap",e:"🏴‍☠️",p:180},{id:"halo",n:"Glória",e:"😇",p:200},{id:"horn",n:"Unikornisszarv",e:"🦄",p:300},{id:"helm",n:"Lovagsisak",e:"🛡️",p:300}];
const HC=["#3b2a20","#8a5a2b","#e2b34a","#d9482b","#7b5cd6","#111111","#b8c0c8","#f3e3a0","#ff8fc4","#3d7be0","#39c9c0","#3fa34d"],SKN=["#fff0e3","#fbd9bd","#f0b98d","#c68a5c","#8a5a3b","#5b3a29"],CL=["#e8573c","#2e9e6b","#3d7be0","#f2a900","#a05bd6","#ff7bb0","#2bb3b3","#ff8a2b","#f4f4f0","#2b2b2b","#7fc4ff","#8c1f3a"];
let S=load(),tab="home",draft=null,unlocked=false,dur=15,sel=null;
function load(){try{return JSON.parse(localStorage.getItem("sh1"))||{kids:[],cur:0,pin:null}}catch(e){return{kids:[],cur:0,pin:null}}}
function save(){try{localStorage.setItem("sh1",JSON.stringify(S))}catch(e){}}
const K=()=>S.kids[S.cur];
const lvl=x=>1+Math.floor(Math.sqrt((x||0)/25)),need=l=>l*l*25;
const TL=[5,10,15,20,25],TB=[5,10,20,35,50];
const tier=l=>TL.filter(x=>l>=x).length-1;
const tr=(k,s)=>Math.max(tier(lvl((k.xp||{})[s]||0)),k.gt&&k.gt[s]!=null?k.gt[s]:-1);
const toolBonus=(k,s,x)=>{const t=tr(k,s);return t<0?0:Math.max(1,Math.round(x*TB[t]/100))};
const tbn=(k,s)=>{const t=tr(k,s);return t<0?"":` · ${SK[s].e} +${TB[t]}%`};
function av(k,w){const h=k.hc,eq=k.eq||[];let hair="",back="";
const base=`<path d="M28 45Q28 20 50 20Q72 20 72 45Q62 32 50 32Q38 32 28 45Z" fill="${h}"/>`;
if(k.hs==0)hair=base;
if(k.hs==1){back=`<rect x="25" y="38" width="11" height="44" rx="5" fill="${h}"/><rect x="64" y="38" width="11" height="44" rx="5" fill="${h}"/>`;hair=base}
if(k.hs==2)hair=base+`<circle cx="50" cy="14" r="9" fill="${h}"/>`;
if(k.hs==3)hair=`<path d="M27 46L28 22L38 32L45 16L52 31L61 17L66 32L74 24L73 46Q62 32 50 32Q38 32 27 46Z" fill="${h}"/>`;
if(k.hs==4){back=`<path d="M66 28Q94 22 90 62Q80 52 72 46Z" fill="${h}"/>`;hair=base+`<circle cx="68" cy="29" r="3.5" fill="#e8573c"/>`}
if(k.hs==5){back=`<path d="M30 40Q12 48 16 78Q24 66 32 52Z M70 40Q88 48 84 78Q76 66 68 52Z" fill="${h}"/>`;hair=base+`<circle cx="30" cy="41" r="3.5" fill="#ff5c9a"/><circle cx="70" cy="41" r="3.5" fill="#ff5c9a"/>`}
if(k.hs==6)hair=base+`<g fill="${h}"><circle cx="32" cy="30" r="8"/><circle cx="42" cy="22" r="8"/><circle cx="54" cy="21" r="8"/><circle cx="65" cy="27" r="8"/><circle cx="72" cy="39" r="7"/><circle cx="28" cy="40" r="7"/></g>`;
if(k.hs==7){back=`<path d="M26 38Q22 72 36 72L38 44Z M74 38Q78 72 64 72L62 44Z" fill="${h}"/>`;hair=base+`<path d="M30 36Q50 28 70 36L70 41Q50 34 30 41Z" fill="${h}"/>`}
if(k.hs==8)hair=`<path d="M28 46Q27 20 50 19Q73 20 72 44Q68 34 58 30Q46 40 28 46Z" fill="${h}"/>`;
if(k.hs==9)hair=`<path d="M30 36Q50 22 70 36Q50 30 30 36Z" fill="${h}" opacity=".9"/>`;
const cape=eq.includes("cape")?`<path d="M30 70L18 118L82 118L70 70Z" fill="#c23b5b"/>`:"";
let acc="";
if(eq.includes("scarf"))acc+=`<rect x="34" y="64" width="32" height="8" rx="4" fill="#ffcf4a"/>`;
if(eq.includes("glass"))acc+=`<circle cx="42" cy="47" r="6" fill="#1118" stroke="#111" stroke-width="2"/><circle cx="58" cy="47" r="6" fill="#1118" stroke="#111" stroke-width="2"/><path d="M48 47h4" stroke="#111" stroke-width="2"/>`;
if(eq.includes("cap"))acc+=`<path d="M27 37Q50 6 73 37Z" fill="#3d7be0"/><rect x="25" y="35" width="54" height="5" rx="2.5" fill="#2a5db8"/>`;
if(eq.includes("crown"))acc+=`<path d="M32 26L35 8L43 18L50 6L57 18L65 8L68 26Z" fill="#ffcf4a" stroke="#c98f00" stroke-width="1.5"/>`;
if(eq.includes("bow"))acc+=`<path d="M66 28L58 23L58 33Z M66 28L74 23L74 33Z" fill="#ff5c9a"/><circle cx="66" cy="28" r="2.5" fill="#d93a7a"/>`;
if(eq.includes("mask"))acc+=`<rect x="30" y="41" width="40" height="11" rx="5" fill="#222"/><circle cx="42" cy="47" r="3" fill="#fff"/><circle cx="58" cy="47" r="3" fill="#fff"/>`;
if(eq.includes("wiz"))acc+=`<path d="M26 36L50 2L74 36Z" fill="#6a3fc4"/><rect x="24" y="34" width="52" height="5" rx="2.5" fill="#4b2a96"/><circle cx="50" cy="20" r="3" fill="#ffcf4a"/>`;
if(eq.includes("halo"))acc+=`<ellipse cx="50" cy="12" rx="16" ry="4" fill="none" stroke="#ffd34a" stroke-width="3"/>`;
if(eq.includes("pirate"))acc+=`<path d="M26 36Q50 8 74 36Z" fill="#1d1d1d"/><rect x="24" y="34" width="52" height="5" rx="2.5" fill="#333"/><circle cx="50" cy="26" r="3.5" fill="#fff"/>`;
if(eq.includes("horn"))acc+=`<path d="M46 26L50 4L54 26Z" fill="#ff9ad5" stroke="#d96bb0" stroke-width="1.5"/>`;
if(eq.includes("helm"))acc+=`<path d="M27 38Q27 14 50 14Q73 14 73 38Z" fill="#aab4bd"/><rect x="26" y="34" width="48" height="6" rx="3" fill="#7d8992"/><path d="M50 14V6" stroke="#e8573c" stroke-width="5" stroke-linecap="round"/>`;
const wing=eq.includes("wings")?`<path d="M30 76Q2 54 8 98Q22 90 30 102Z M70 76Q98 54 92 98Q78 90 70 102Z" fill="#dff3ff" stroke="#8fc8ea" stroke-width="2"/>`:"";
if(eq.includes("flower"))acc+=`<circle cx="66" cy="30" r="5" fill="#ff7bb0"/><circle cx="66" cy="30" r="2" fill="#ffe27a"/>`;
let hnd="";if(k.hand&&k.xp){const t=tr(k,k.hand);if(t>=0)hnd=`<circle cx="81" cy="96" r="14" fill="${TC[t]}" opacity=".45"/><text x="81" y="104" font-size="22" text-anchor="middle">${SK[k.hand].e}</text>`}
return `<svg viewBox="0 0 100 120" width="${w}" height="${w*1.2}" style="flex:none">${wing}${cape}${back}<rect x="30" y="68" width="40" height="46" rx="14" fill="${k.cl}"/><circle cx="50" cy="46" r="22" fill="${k.sk}"/>${hair}<circle cx="42" cy="48" r="2.6" fill="#222"/><circle cx="58" cy="48" r="2.6" fill="#222"/><path d="M43 56Q50 62 57 56" stroke="#a33" stroke-width="2.2" fill="none" stroke-linecap="round"/>${acc}${hnd}</svg>`}
function toast(m){const d=document.createElement("div");d.className="toast";d.innerHTML=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
function nav(){return`<nav>${[["home","🏠","Kaland"],["q","📜","Feladatok"],["inv","🎒","Táska"],["shop","🛍️","Bolt"],["par","🔑","Szülő"]].map(a=>`<button class="${tab==a[0]?"on":""}" onclick="tab='${a[0]}';R()"><b>${a[1]}</b>${a[2]}</button>`).join("")}</nav>`}
function creator(){const d=draft;
const sw=(arr,key)=>arr.map((c,i)=>`<button class="sw ${d[key]==c||d[key]===i?"on":""}" style="background:${c}" onclick="draft.${key}=${typeof c=="string"?`'${c}'`:i};R()"></button>`).join("");
return`<h2>${d.eid?"Kinézetem módosítása":"Új hős készítése"}</h2><div class="card row" style="align-items:flex-start">${av(d,130)}<div class="g">
${d.eid?"":`<input id="nm" placeholder="Hős neve" value="${d.name}" oninput="draft.name=this.value">`}
<p class="mut" style="margin:8px 0 4px">Nem</p><div class="row"><button class="alt ${d.g=="f"?"on":""}" onclick="draft.g='f';if(!draft.eid)draft.hs=1;R()">Lány</button><button class="alt ${d.g=="m"?"on":""}" onclick="draft.g='m';if(!draft.eid)draft.hs=0;R()">Fiú</button></div></div></div>
<div class="card"><p class="mut" style="margin:0 0 6px">Frizura</p><div class="row" style="flex-wrap:wrap">${["Rövid","Hosszú","Kontyos","Tüskés","Lófarok","Két copf","Göndör","Bob","Frufrus","Rövidre nyírt"].map((n,i)=>`<button class="alt ${d.hs==i?"on":""}" onclick="draft.hs=${i};R()">${n}</button>`).join("")}</div>
<p class="mut" style="margin:10px 0 6px">Hajszín</p><div class="row" style="flex-wrap:wrap">${sw(HC,"hc")}</div>
<p class="mut" style="margin:10px 0 6px">Bőrszín</p><div class="row" style="flex-wrap:wrap">${sw(SKN,"sk")}</div>
<p class="mut" style="margin:10px 0 6px">Ruha színe</p><div class="row" style="flex-wrap:wrap">${sw(CL,"cl")}</div></div>
${d.eid?`<button style="width:100%" onclick="saveLook()">Mentés</button><button class="alt" style="width:100%;margin-top:8px" onclick="draft=null;R()">Mégsem</button>`:`<button style="width:100%" onclick="mk()">Indulhat a kaland!</button>${S.kids.length?`<button class="alt" style="width:100%;margin-top:8px" onclick="draft=null;R()">Mégsem</button>`:""}`}`}
function mk(){const d=draft;if(!d.name.trim()){toast("Adj nevet a hősnek!");return}
S.kids.push({...d,id:Date.now(),xp:{},coins:0,owned:[],eq:[],pend:[],news:[]});S.cur=S.kids.length-1;draft=null;tab="home";save();R()}
function newDraft(){draft={name:"",g:"f",hs:1,hc:HC[1],sk:SKN[2],cl:CL[1]}}
function R(){const a=document.getElementById("app");if(!S.pin){a.innerHTML=pinSetup();return}S.cq=S.cq||[];S.kids.forEach(k=>{k.pets=k.pets||[];k.pn=k.pn||{};k.px=k.px||{};k.claims=k.claims||[];k.st=k.st||{};k.hw=k.hw||{};k.tc=k.tc||0;k.gt=k.gt||{}});
if(!S.kids.length&&!draft)newDraft();
if(draft){a.innerHTML=creator();return}
const k=K(),tot=Object.values(k.xp).reduce((a,b)=>a+b,0);
let h=`<div class="top">${S.kids.map((x,i)=>`<button class="${i==S.cur?"on":""}" onclick="S.cur=${i};save();R()">${av(x,22)}${x.name}</button>`).join("")}<button onclick="newDraft();R()">＋</button></div>`;
if(tab=="home"){
h+=`<div class="card row">${av(k,110)}${petv(k)}<div class="g"><h2>${k.name}</h2><div class="mut">Hős szint ${1+Math.floor(Math.sqrt(tot/60))}</div><div class="row" style="margin-top:6px;flex-wrap:wrap"><span class="chip">⭐ ${tot} XP</span><span class="chip">🪙 ${k.coins}</span><span class="chip">🎁 ${k.tc%10}/10</span></div></div></div>`;
h+=`<button class="alt" style="width:100%;margin-top:6px" onclick="tab='help';R()">📖 Hogyan működik?</button>`;
if(k.news.length)h+=`<div class="card" style="border-color:var(--acc)">${k.news.map(n=>`<div>${n}</div>`).join("")}<button style="margin-top:8px" onclick="K().news=[];save();R()">Szuper!</button></div>`;
h+=`<h3 style="margin-top:14px">Képességeim</h3>`+Object.keys(SK).map(s=>{const x=k.xp[s]||0,l=lvl(x),lo=(l-1)*(l-1)*25,p=Math.round((x-lo)/(need(l)-lo)*100);
return`<div class="card"><div class="row sp"><b>${SK[s].i} ${SK[s].n}</b><span class="chip">${l}. szint</span></div><div class="bar" style="margin:6px 0 2px"><i style="width:${p}%"></i></div><div class="mut">${x} / ${need(l)} XP · ${tr(k,s)>=0?SK[s].t[tr(k,s)]:"még nincs eszköz"}</div></div>`}).join("")}
if(tab=="help")h+=helpView();
if(tab=="q"){
h+=`<h2>Mai feladatok</h2><p class="mut">Válassz feladatot, mondd meg mennyi ideig segítettél, aztán a szülő jóváhagyja.</p><p class="mut">🔥 Napi sorozat: fogmosás, fürdés és állatgondozás minden nap (3, 7, 14 és 30 napnál bónusz érme).<br> 📚 Házi feladat: egy héten 5 különböző napon bónusz. <br>🎁 Minden 10. jóváhagyott feladat után meglepetésláda: 95% eséllyel 1–1000 érme, 5% eséllyel ajándék eszköz (eggyel magasabb fokozat).</p>`;

<h3 style="margin-top:14px">Ruhatár</h3>${k.owned.length?`<div class="grid">${k.owned.map(id=>{const it=SHOP.find(x=>x.id==id),on=k.eq.includes(id);return`<button class="alt ${on?"on":""}" onclick="eqp('${id}')"><div style="font-size:30px">${it.e}</div>${it.n}<div class="mut">${on?"Viseled":"Felveszem"}</div></button>`}).join("")}</div>`:`<p class="mut">Még üres. Nézz be a boltba!</p>`}`}

a.innerHTML=h+nav()}
function rep(id){const q=allQ().find(x=>x.id==id),k=K();k.pend.push({t:Date.now(),n:q.n,i:q.i,s:q.s,m:dur,xp:q.x+dur,q:q.id});save();toast("Elküldve a szülőnek!<br>"+q.i+" "+q.n);R()}
const fk=id=>S.kids.find(x=>x.id==id);
function ok(id,t){const k=fk(id),p=k.pend.find(x=>x.t==t);k.pend=k.pend.filter(x=>x.t!=t);
const b=lvl(k.xp[p.s]);const tbx=toolBonus(k,p.s,p.xp),obx=(k.pa=="owl"&&p.s=="tanul")?Math.max(1,Math.round(p.xp*.2)):0;p.xp+=tbx+obx+(k.pa?Math.min(5,plv(k.px[k.pa])-1):0);k.xp[p.s]=(k.xp[p.s]||0)+p.xp;
let cn=Math.ceil(p.xp/2)*(isX2(k.pa)?2:1);
if(k.pets){
k.pets.forEach(pid=>{if(pid!==k.pa){cn+=Math.min(5,plv(k.px[pid]||0));}});}
k.coins+=cn;
if(k.pa){const pl=plv(k.px[k.pa]);k.px[k.pa]=(k.px[k.pa]||0)+Math.ceil(p.xp*.6);const nl=plv(k.px[k.pa]);if(nl>pl){k.news.push(`🐾 ${k.pn[k.pa]||"A társad"} szintet lépett: ${nl}. szint! Több bónusz XP jár.`);toast(`🐾 ${k.pn[k.pa]||"A társ"}: ${nl}. szint!`)}}
const a=lvl(k.xp[p.s]);
k.news.push(`⭐ +${p.xp} XP és 🪙 +${cn} a(z) „${p.n}” feladatért!${tbx?` ${SK[p.s].e} eszközbónusz: +${tbx} XP`:""}${obx?` 🦉 bagoly: +${obx} XP`:""}`);
if(a>b){k.news.push(`🎉 ${SK[p.s].n}: ${a}. szint!`+(tier(a)>tier(b)?` Új eszköz: <b>${SK[p.s].t[tier(a)]}</b> ${SK[p.s].e}`:""));toast(`🎉 ${k.name}: ${SK[p.s].n} ${a}. szint!`)}
bonus(k,p);save();R()}
function no(id,t){const k=fk(id);k.pend=k.pend.filter(x=>x.t!=t);save();R()}
function buy(id){const k=K(),it=SHOP.find(x=>x.id==id);if(k.coins<it.p)return;k.coins-=it.p;k.owned.push(id);k.eq.push(id);save();toast(it.e+" "+it.n+" a tied!");R()}
function eqp(id){const k=K();k.eq=k.eq.includes(id)?k.eq.filter(x=>x!=id):[...k.eq,id];save();R()}
function petv(k){if(!k.pa)return"";const p=PETS.find(x=>x.id==k.pa),l=plv(k.px[k.pa]);return`<div style="text-align:center"><div style="font-size:${30+Math.min(l,5)*7}px;line-height:1.1">${p.e}</div><div class="mut" style="font-size:12px">${k.pn[p.id]||p.n}<br>${l}. szint${isX2(p.id)?"<br><b>🪙 2x</b>":p.id=="owl"?"<br><b>📚 +20%</b>":""}</div></div>`}
function shopMore(k){let h=`<h3 style="margin-top:16px">Kis társak</h3><p class="mut">Az aktív társ (akit magad mellé hívtál) a jóváhagyott feladatokból fejlődik. A 2. szinttől szintenként +1 bónusz XP jár minden feladatért, legfeljebb +5 (a 6. szinten), és ennek megfelelően több érme is. Különleges társak: a 🐲 Sárkány, 🦄 Unikornis és 🔥 Főnix aktívként 2x érmét hoz minden feladatért, a 🦉 Bagoly pedig +20% XP-t a Tanulás feladatokért. A megszerzett társaidat a Táskában találod. A táskában lévő társak nem fejlődnek, de szintjük szerint extra érmét hoznak minden jóváhagyott feladat után (társonként legfeljebb +5).</p><input id="pn" placeholder="Név a kis társnak" style="margin:6px 0">`;
h+=PETS.slice().sort((a,b)=>a.p-b.p).map(p=>{const own=k.pets.includes(p.id);return`<div class="card row"><span style="font-size:34px">${p.e}</span><div class="g"><b>${p.n}${isX2(p.id)?" 2x 🪙 bónusz":p.id=="owl"?" +20% XP (Tanulás)":""}</b><div class="mut">${own?"A társaid között van":"🪙 "+p.p}</div></div><button ${own||k.coins<p.p?"disabled":""} onclick="adopt('${p.id}')">${own?"Megvan":"Befogadom"}</button></div>`}).join("");
h+=`<h3 style="margin-top:16px">Jutalmak</h3><p class="mut">Váltsd be az érméidet valódi jutalomra!</p>`+rw().map(r=>`<div class="card row"><span style="font-size:30px">${r.e}</span><div class="g"><b>${r.n}</b><div class="mut">🪙 ${r.p}</div></div><button ${k.coins<r.p?"disabled":""} onclick="claim('${r.id}')">Kérem!</button></div>`).join("");return h}
function adopt(id){const k=K(),p=PETS.find(x=>x.id==id);if(k.coins<p.p)return;const el=document.getElementById("pn");k.coins-=p.p;k.pets.push(id);k.pn[id]=(el&&el.value.trim())||p.n;k.px[id]=0;k.pa=id;save();toast(p.e+" "+k.pn[id]+" mostantól a társad!");R()}
function act(id){K().pa=id;save();R()}
function claim(id){const k=K(),r=rw().find(x=>x.id==id);if(!r||k.coins<r.p)return;k.coins-=r.p;k.claims.push({t:Date.now(),n:r.n,e:r.e,p:r.p});save();toast(r.e+" Elküldve a szülőnek: "+r.n);R()}
function cdone(id,t,y){const k=fk(id),c=k.claims.find(x=>x.t==t);k.claims=k.claims.filter(x=>x.t!=t);if(!y)k.coins+=c.p;save();R()}
function addq(){const n=qn.value.trim();if(!n){toast("Írd be a feladat nevét");return}const s=qs.value;S.cq.push({id:Date.now(),n,i:SK[s].e,s,x:Math.max(1,+qx.value||10),d:qd.checked?1:0});save();R()}
function delq(id){S.cq=S.cq.filter(q=>q.id!=id);save();R()}
function addr(){const n=rn.value.trim();if(!n){toast("Írd be a jutalom nevét");return}S.rw=rw().concat([{id:"r"+Date.now(),n,e:re.value||"🎁",p:Math.max(1,+rp.value||50)}]);save();R()}
function delr(id){S.rw=rw().filter(r=>r.id!=id);save();R()}
function parExtra(){let h="";const cl=S.kids.flatMap(x=>x.claims.map(c=>({x,c})));
if(cl.length)h+=`<h3 style="margin-top:14px">Jutalom-kérések</h3>`+cl.map(({x,c})=>`<div class="card"><b>${x.name}: ${c.e} ${c.n}</b><div class="row" style="margin-top:8px"><button onclick="cdone(${x.id},${c.t},1)">Átadtam ✔</button><button class="alt" onclick="cdone(${x.id},${c.t},0)">Érmék vissza</button></div></div>`).join("");
if(S.kids.length)h+=`<h3 style="margin-top:14px">Hős nevének módosítása</h3><div class="card"><select id="rk">${S.kids.map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}</select><div class="row" style="margin-top:8px"><input id="rnm" placeholder="Új név"><button onclick="renk()">Mentés</button></div></div>`;
h+=`<h3 style="margin-top:14px">Saját feladat felvétele</h3><div class="card"><input id="qn" placeholder="Feladat neve (pl. Matek házi)"><div class="row" style="margin-top:8px"><select id="qs" style="flex:1">${Object.keys(SK).map(s=>`<option value="${s}">${SK[s].i} ${SK[s].n}</option>`).join("")}</select><input id="qx" type="number" value="10" min="1" style="width:80px"></div><label class="row mut" style="margin-top:8px"><input type="checkbox" id="qd" style="width:auto"> 🔥 Napi sorozatos feladat</label><button style="margin-top:8px" onclick="addq()">Hozzáadás</button>${S.cq.map(q=>`<div class="row sp mut" style="margin-top:6px"><span>${q.i} ${q.n} · ${q.x} XP${q.d?" · 🔥":""}</span><button class="alt" onclick="delq(${q.id})">✕</button></div>`).join("")}</div>`;
h+=`<h3 style="margin-top:14px">Jutalmak kezelése</h3><div class="card"><input id="rn" placeholder="Jutalom (pl. Fagyizás)"><div class="row" style="margin-top:8px"><input id="re" value="🍦" style="width:70px"><input id="rp" type="number" value="100" style="width:90px"><button onclick="addr()">Hozzáadás</button></div>${rw().map(r=>`<div class="row sp mut" style="margin-top:6px"><span>${r.e} ${r.n} · 🪙 ${r.p}</span><button class="alt" onclick="delr('${r.id}')">✕</button></div>`).join("")}</div>`;h+=backupView();return h}
function pinSetup(){return`<h2>Üdv a Segítő Hősökben!</h2><div class="card"><p style="margin-top:0">Szülő, először állíts be egy PIN-kódot. Ezzel hagyod majd jóvá a gyerekek feladatait.</p><input id="p1" type="password" inputmode="numeric" placeholder="Új PIN (legalább 4 számjegy)"><input id="p2" type="password" inputmode="numeric" placeholder="PIN újra" style="margin-top:8px"><button style="margin-top:10px;width:100%" onclick="setpin()">Mentés és indulás</button><p class="mut" style="margin-bottom:0">Jegyezd meg jól, és a gyerekeknek ne mondd el. Az adatok csak ezen az eszközön és böngészőben tárolódnak; a böngészőadatok törlésével elvesznek, ezért érdemes időnként menteni a Szülő fülön.</p></div>`}
function setpin(){const a=p1.value,b=p2.value;if(!/^\d{4,}$/.test(a)){toast("Legalább 4 számjegy kell");return}if(a!=b){toast("A két PIN nem egyezik");return}S.pin=a;unlocked=false;save();R()}
const dk=t=>new Date(t).toLocaleDateString("sv");
function wk(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString("sv")}
const SB={3:30,7:100,14:250,30:600},HWB=300;
function sinfo(k,q){if(q.d){const s=k.st[q.id];if(!s||!s.n)return" · 🔥 indítsd el!";const y=new Date();y.setDate(y.getDate()-1);const t=s.last==dk(Date.now());if(t||s.last==dk(y))return` · 🔥 ${s.n} nap`+(t?" ✔ ma kész":"");return" · 🔥 kezdd újra!"}
if(q.h){const n=k.hw.wk==wk(Date.now())?k.hw.days.length:0;return` · 📚 ${n}/5 a héten`}return""}
function bonus(k,p){const q=allQ().find(x=>x.id==p.q),day=dk(p.t);
if(q&&q.d){const s=k.st[q.id]||(k.st[q.id]={last:"",n:0});if(s.last<day){const y=new Date(p.t);y.setDate(y.getDate()-1);s.n=s.last==dk(y)?s.n+1:1;s.last=day;const b=SB[s.n]||(s.n>30&&s.n%30==0?600:0);if(b){k.coins+=b;k.news.push(`🔥 ${s.n} napos sorozat: ${q.n}! 🪙 +${b}`);toast(`🔥 ${s.n} nap egymás után!`)}}}
if(q&&q.h){const w=wk(p.t),h=k.hw;if(h.wk!=w){h.wk=w;h.days=[];h.got=0}if(!h.days.includes(day))h.days.push(day);if(h.days.length>=5&&!h.got){h.got=1;k.coins+=HWB;k.news.push(`📚 Heti házi feladat sorozat: 5 nap! 🪙 +${HWB}`);toast("📚 Heti sorozat teljesítve!")}}
k.tc=(k.tc||0)+1;if(k.tc%10==0){const cand=Object.keys(SK).filter(s=>tr(k,s)<4);if(cand.length&&Math.random()<.05){const s=cand[Math.floor(Math.random()*cand.length)],t=tr(k,s)+1;k.gt=k.gt||{};k.gt[s]=t;k.news.push(`🎁 Meglepetésláda: ajándék eszköz! <b>${SK[s].t[t]}</b> ${SK[s].e} (+${TB[t]}% XP)`);toast(`🎁 Ajándék eszköz: ${SK[s].t[t]}!`)}else{const r=1+Math.floor(Math.random()*1000);k.coins+=r;k.news.push(`🎁 Meglepetésláda! 🪙 +${r}`);toast(`🎁 Meglepetésláda: 🪙 +${r}`)}}}
function toolsView(k){let h=`<p class="mut">Az eszköz bónusz XP-t ad az adott képesség feladataiért (az érme is az XP-ből jön). Eszközt a képesség szintjével érdemelsz ki: 5. szinten fa, 10-en vas, 15-en ezüst, 20-on arany, 25-en gyémánt. A meglepetésládából is jöhet ajándék eszköz 🎁. A kézbe vett eszköz megjelenik a hősödnél.</p><div class="grid">`;
return h+Object.keys(SK).map(s=>{const l=lvl(k.xp[s]||0),t=tr(k,s),g=k.gt&&k.gt[s]>tier(l);
if(t<0)return`<div class="tool" style="border-color:var(--line);opacity:.85"><div class="e" style="filter:grayscale(1)">${SK[s].e}</div><b>🔒 ${SK[s].t[0]}</b><div class="mut">az ${TL[0]}. szinten kapod<br>${SK[s].n}: ${l}. szint</div></div>`;
const nx=t<4?`Következő: ${SK[s].t[t+1]} (${TL[t+1]}. szint)`:"Legendás!";
return`<div class="tool" style="border-color:${TC[t]}"><div class="e">${SK[s].e}</div><b>${SK[s].t[t]}${g?" 🎁":""}</b><div class="mut">+${TB[t]}% XP<br>${nx}</div><button class="alt ${k.hand==s?"on":""}" style="margin-top:6px;padding:4px 8px;font-size:13px" onclick="hand('${s}')">${k.hand==s?"Kezedben":"Kézbe veszem"}</button></div>`}).join("")+`</div>`}
function hand(s){const k=K();k.hand=k.hand==s?null:s;save();R()}
function helpView(){const d=(t,b)=>`<details class="card"><summary><b>${t}</b></summary><div style="margin-top:8px">${b}</div></details>`;

return`<h2>Hogyan működik?</h2><p class="mut">Koppints egy részre, és kinyílik.</p>`+
d("⭐ XP és szintek","Minden feladat XP-t ér, és minél tovább segítesz, annál többet. Amikor a szülő jóváhagyja, a képességed megkapja az XP-t, és ha elég összegyűlt, szintet lépsz. Egy-egy szinthez mindig egy kicsit több XP kell, mint az előzőhöz. Kb. ennyi feladat kell: 2. szint 1-2 feladat után, 3. szint 4-5 feladat után, 5. szint 16 feladat után, 10. szint 80 feladat után.")+
d("🛠️ Eszközök és bónuszok",`Alapból nincs eszközöd, a képesség szintjével érdemled ki: ${["fa","vas","ezüst","arany","gyémánt"].map((n,i)=>`${TL[i]}. szint: ${n} (+${TB[i]}% XP)`).join(" · ")}. A bónusz az adott képesség feladataiért jár, és az érme is nő vele. Az eszközt kézbe is veheted a Táskában, ekkor a hősödnél látszik. Meglepetésládából ajándék eszköz is jöhet: eggyel magasabb fokozat. A szint és az ajándék közül a magasabb számít.`)+
d("🐾 Kis társak","Az aktív társ a jóváhagyott feladatokból fejlődik. A 2. szinttől szintenként +1 bónusz XP jár, legfeljebb +5. Különleges társak: a 🐲 Sárkány, 🦄 Unikornis és 🔥 Főnix aktívként 2x érmét ad, a 🦉 Bagoly pedig +20% XP-t a Tanulás feladatokért. A táskában lévő kis társak nem fejlődnek, viszont minden jóváhagyott feladat után plusz érmét adnak a saját szintjük alapján (társonként legfeljebb +5).")+
d("🔥 Sorozatok",`Napi sorozat: fogmosás, fürdés, állatgondozás és a szülő által megjelölt feladatok. Egymás utáni napokon bónusz érme: ${Object.entries(SB).map(([n,b])=>`${n}. nap +${b}`).join(", ")}. 📚 Házi feladat: egy héten (hétfőtől vasárnapig) 5 különböző napon +${HWB} érme.`)+
d("🎁 Meglepetésláda","Minden 10. jóváhagyott feladat után meglepetésláda jár: 95% eséllyel 1–1000 érme, 5% eséllyel ajándék eszköz.")+
d("🪙 Érme és jutalmak","Egy feladatért az XP felének megfelelő érme jár (felfelé kerekítve, a Sárkánnyal, Unikornissal és Főnixszel dupla). A Boltban ruhát és kis társat vehetsz, vagy valódi jutalmat kérhetsz, amit a szülő ad át.")+
d("🔑 Szülőknek","A Szülő fülön PIN-kóddal hagyod jóvá a feladatokat és az érmés jutalmak átadását. Saját feladatot és jutalmat is felvehetsz, és megjelölheted, hogy egy feladat napi sorozatos legyen. A Mentés és visszaállítás résszel az adatokat fájlba mentheted, és másik eszközre is átviheted.")+d("💾 Hol vannak az adataim?","Az adatok (hősök, XP, érmék, társak) csak azon az eszközön és abban a böngészőben vannak, ahol használod, sehova nem kerülnek elküldésre. Ha törlöd a böngésző adatait (előzmények, webhelyadatok), vagy másik böngészőből vagy eszközről nyitod meg, a hősök nem látszanak. Ezért érdemes hetente fájlba menteni a Szülő fülön a Mentés és visszaállítás résszel.")+back}
function renk(){const k=fk(+rk.value),n=rnm.value.trim();if(!k||!n){toast("Írd be az új nevet");return}k.name=n;save();toast("Név módosítva: "+n);R()}
function petsView(k){let h=`<h3 style="margin-top:14px">🐾 Kis társaim</h3>`;
if(!k.pets.length)return h+`<p class="mut">Még nincs társad. Nézz be a boltba!</p>`;
return h+`<p class="mut">Az aktív társ fejlődik és XP bónuszt ad. A 🐲 Sárkány, 🦄 Unikornis és 🔥 Főnix aktívként 2x érmét hoz, a 🦉 Bagoly +20% XP-t a Tanulás feladatokért. A táskában lévő társaid nem fejlődnek tovább, viszont minden jóváhagyott feladatnál bónusz érmét hoznak a szintjük alapján (társonként legfeljebb +5).</p>`+k.pets.map(id=>{const p=PETS.find(x=>x.id==id),l=plv(k.px[id]),a=k.pa==id;return`<div class="card row"><span style="font-size:34px">${p.e}</span><div class="g"><b>${k.pn[id]||p.n}${a?" ✔":""}</b><div class="mut">${p.n} · ${l}. szint · bónusz: +${Math.min(5,l-1)} XP${petTag(id)}${a?"":` (ha melletted van) · 🪙 +${Math.min(5,l)} érme feladatonként a táskában`}</div></div><button class="${a?"":"alt"}" ${a?"disabled":""} onclick="act('${id}')">${a?"Veled van":"Mellém hívom"}</button></div>`}).join("")}
function editLook(){const k=K();draft={...k,eid:k.id};R();}
function saveLook(){const k=K(),d=draft;["g","hs","hc","sk","cl"].forEach(f=>k[f]=d[f]);draft=null;save();toast("Kinézet elmentve");R()}
const BK="sh1_b",PK="sh1_pre";let rs=null;
function bget(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function pget(){try{return JSON.parse(localStorage.getItem(PK))}catch(e){return null}}
function exp(){const {pin,...r}=S;return{app:"segito-hosok",v:1,t:Date.now(),data:r}}
function autoBackup(){try{if(!S.kids.length)return;const d=new Date().toLocaleDateString("sv"),b=bget(BK);if(b.length&&b[b.length-1].d==d)return;b.push({d,j:JSON.stringify(exp())});localStorage.setItem(BK,JSON.stringify(b.slice(-3)))}catch(e){}}
const bname=()=>"segito-hosok-"+new Date().toLocaleDateString("sv")+".json";
async function shareBackup(){const j=JSON.stringify(exp());try{const f=new File([j],bname().replace(".json",".txt"),{type:"text/plain"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Segítő Hősök mentés"});S.lx=Date.now();save();R();return}}catch(e){if(e&&e.name=="AbortError")return}dlBackup("Ezen az eszközön a megosztás nem érhető el, ezért letöltöttem a fájlt.")}
function dlBackup(m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(exp())],{type:"application/json"}));a.download=bname();document.body.appendChild(a);a.click();a.remove();S.lx=Date.now();save();toast(m||"Mentés letöltve");R()}
function pickRestore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!="segito-hosok"||!o.data||!Array.isArray(o.data.kids))throw 0;askRestore(o,"Fájl: "+f.name)}catch(e){toast("Ez nem a játék mentése")}};r.readAsText(f)}
function askRestore(o,label){rs={o,label};R()}
function askInt(d){const x=bget(BK).find(y=>y.d==d);if(x)askRestore(JSON.parse(x.j),"Belső mentés ("+d+")")}
function askPre(){const p=pget();if(p)askRestore(JSON.parse(p.j),"Visszaállítás előtti állapot ("+p.d+")")}
function applyRestore(){if(!rs)return;const o=rs.o;try{localStorage.setItem(PK,JSON.stringify({d:new Date().toLocaleString("hu-HU"),j:JSON.stringify(exp())}))}catch(e){}
const pin=S.pin,lx=S.lx;S=o.data;S.pin=pin;S.lx=lx;S.cur=Math.min(S.cur||0,Math.max(0,S.kids.length-1));rs=null;draft=null;save();toast("Visszaállítva");R()}
function backupView(){const d=S.lx?Math.floor((Date.now()-S.lx)/864e5):null,warn=d===null||d>7;
let h=`<h3 style="margin-top:14px">💾 Mentés és visszaállítás</h3><div class="card"${warn?' style="border-color:var(--acc2)"':""}><p style="margin-top:0">${d===null?"Még nem volt fájlmentés.":`Utolsó fájlmentés: ${d?d+" napja":"ma"}.`}${warn?" Érdemes most menteni!":""}</p><div class="row" style="flex-wrap:wrap"><button onclick="shareBackup()">📤 Megosztás</button><button class="alt" onclick="dlBackup()">⬇️ Letöltés fájlként</button></div><p class="mut">A mentés tartalmazza a gyerekek nevét és adatait, a PIN-kódot nem. Tárold privát helyen (például a saját e-mailedben).</p><p style="margin-bottom:4px"><b>Visszaállítás fájlból</b></p><input type="file" accept=".json,.txt,application/json,text/plain" onchange="pickRestore(this.files[0])">`;
const b=bget(BK),pre=pget();
if(b.length||pre)h+=`<p style="margin:12px 0 4px"><b>Belső mentések</b> <span class="mut">(az utolsó 3 nap; a böngészőadat törlése ezeket is viszi)</span></p><div class="row" style="flex-wrap:wrap">${b.slice().reverse().map(x=>`<button class="alt" onclick="askInt('${x.d}')">📅 ${x.d}</button>`).join("")}${pre?`<button class="alt" onclick="askPre()">↩️ Visszaállítás előtti</button>`:""}</div>`;
if(rs)h+=`<div class="card" style="border-color:var(--acc2)"><b>Biztosan felülírod a mostani adatokat?</b><p class="mut">${rs.label}: ${rs.o.data.kids.length} hős (${rs.o.data.kids.map(k=>k.name).join(", ")}). Előtte automatikus biztonsági másolat készül a mostani állapotról.</p><div class="row"><button onclick="applyRestore()">Igen, visszaállítom</button><button class="alt" onclick="rs=null;R()">Mégsem</button></div></div>`;
return h+`</div>`}
autoBackup();
R();
</script></body></html>
